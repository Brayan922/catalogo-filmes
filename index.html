<p class="Resumo-filme-1" O protagonista Sean Boswell (Lucas Black) é um adolescente problemático que vive se envolvendo em rachas ilegais nos Estados Unidos. Após causar um grave acidente no Arizona, ele é enviado a Tóquio para morar com seu pai, um militar da Marinha, como forma de evitar a cadeia.</p>

  <p class="resumo-filme-2" bairro surge na década de 1960 como um conjunto habitacional para remover pessoas de favelas da Zona Sul e de áreas atingidas por enchentes e incêndios</p>

 <img class="imagem-filme-3" src="//encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS_ZocOwVxJjFXVLOeiGTo5FMRxlXKce1n5Cw4K_us8Ww&s=10" alt="">
